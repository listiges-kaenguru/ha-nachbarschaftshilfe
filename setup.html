<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<meta name="color-scheme" content="light dark" />
<title>Einrichtung</title>
<link rel="stylesheet" href="style.css" />
<script src="theme.js"></script>
<script src="setup.js" defer></script>
</head>
<body>
  <header>
    <fieldset class="theme-switch">
      <legend>Farbschema</legend>
      <input type="radio" name="theme" id="theme-light" value="light" />
      <label for="theme-light">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span class="txt">Hell</span>
      </label>
      <input type="radio" name="theme" id="theme-dark" value="dark" />
      <label for="theme-dark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <span class="txt">Dunkel</span>
      </label>
      <input type="radio" name="theme" id="theme-system" value="system" />
      <label for="theme-system">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
        <span class="txt">System</span>
      </label>
    </fieldset>
  </header>

  <main>
    <div class="card wide">
      <h1>Einrichtung</h1>
      <p class="lead">Verschlüsselt die Webhook-URL mit deinem PIN. Diese Seite nur
        <strong>lokal</strong> öffnen. Alles passiert in deinem Browser, nichts wird gesendet.</p>

      <form id="setupForm" autocomplete="off">
        <label class="field" for="url">Webhook-URL</label>
        <input class="input" id="url" type="url" required
               placeholder="https://…/api/webhook/…" spellcheck="false" />

        <label class="field" for="pin">PIN</label>
        <input class="input pin" id="pin" type="password" required minlength="4"
               aria-describedby="pinHint" />
        <p class="hint" id="pinHint">Mindestens 4 Zeichen. Je länger, desto sicherer; Buchstaben und Zahlen sind erlaubt.</p>

        <label class="field" for="pin2">PIN wiederholen</label>
        <input class="input pin" id="pin2" type="password" required />

        <button class="btn" id="goBtn" type="submit">Verschlüsseln</button>
      </form>

      <div class="status" id="status" role="status" aria-live="polite">
        <span id="statusIcon"></span>
        <div id="statusText"></div>
      </div>

      <section id="result" class="hidden" aria-labelledby="resultTitle">
        <hr />
        <label class="field" id="resultTitle" for="out">Inhalt für <code>payload.js</code></label>
        <textarea class="input" id="out" readonly spellcheck="false"></textarea>
        <div class="btn-row">
          <button class="btn" id="downloadBtn" type="button">payload.js herunterladen</button>
          <button class="btn secondary" id="copyBtn" type="button">Kopieren</button>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
