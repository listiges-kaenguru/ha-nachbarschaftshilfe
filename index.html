<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<meta name="color-scheme" content="light dark" />
<title>Nachbarschaftshilfe</title>
<link rel="stylesheet" href="style.css" />
<script src="theme.js"></script>
<script src="payload.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
  <header>
    <fieldset class="theme-switch">
      <legend>Farbschema</legend>
      <input type="radio" name="theme" id="theme-light" value="light" />
      <label for="theme-light">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span class="txt">Hell</span>
      </label>
      <input type="radio" name="theme" id="theme-dark" value="dark" />
      <label for="theme-dark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <span class="txt">Dunkel</span>
      </label>
      <input type="radio" name="theme" id="theme-system" value="system" />
      <label for="theme-system">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
        <span class="txt">System</span>
      </label>
    </fieldset>
  </header>

  <main>
    <div class="card">
      <h1>Automation auslösen</h1>
      <p class="lead" id="lead">Bitte gib den PIN ein, um fortzufahren.</p>

      <form id="pinForm" autocomplete="off">
        <label class="field" for="pinInput">PIN</label>
        <input class="input pin" id="pinInput" type="password" required
               aria-describedby="status" />
        <button class="btn" id="pinBtn" type="submit">Entsperren</button>
      </form>

      <button class="btn hidden" id="triggerBtn" type="button">Jetzt auslösen</button>

      <div class="status" id="status" role="status" aria-live="polite">
        <span id="statusIcon"></span>
        <div id="statusText"></div>
      </div>
    </div>
  </main>
</body>
</html>
